---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudian-cosi-driver
  labels:
    app.kubernetes.io/name: cloudian-cosi-driver
    app.kubernetes.io/part-of: cloudian-cosi-driver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudian-cosi-driver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudian-cosi-driver
    spec:
      containers:
        - name: cloudian-cosi-driver
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: "{{ .Values.image.imagePullPolicy }}"
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket
{{ if .Values.existingS3CertificateSecret }}
            - mountPath: /usr/local/share/ca-certificates
              name: s3-certs
              readOnly: true
{{ end }}
          env:
          - name: S3_REGION
            value: {{ .Values.s3.region }}
          - name: S3_ENDPOINT
            value: {{ .Values.s3.s3Endpoint }}
          - name: IAM_ENDPOINT
            value: {{ .Values.s3.iamEndpoint }}
{{- $admin := .Values.admin | default dict }}
{{- if $admin.endpoint }}
          - name: ADMIN_ENDPOINT
            value: {{ $admin.endpoint }}
{{- end }}
          - name: DISABLE_TLS_CERTIFICATE_CHECK
            value: "{{ default false .Values.disableTLSCertificateCheck }}"
          envFrom:
          - secretRef:
              name: {{ .Values.existingCredentialsSecret | default "cloudian-cosi-secret" }}
        - name: objectstorage-driver-sidecar
          image: "{{ .Values.sidecar.image.repository }}:{{ .Values.sidecar.image.tag }}"
          imagePullPolicy: "{{ .Values.sidecar.image.imagePullPolicy }}"
          args: ["--debug", "-v", "100"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - mountPath: /var/lib/cosi
              name: socket
      volumes:
        - name: socket
          emptyDir: {}
{{ if .Values.existingS3CertificateSecret }}
        - name: s3-certs
          secret:
            secretName: {{ .Values.existingS3CertificateSecret }}
{{ end }}
