{{ if not .Values.existingCredentialsSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudian-cosi-secret
  labels:
    app.kubernetes.io/part-of: cloudian-cosi-driver
data:
  S3_ACCESS_KEY: {{ .Values.s3.accessKey | toString | b64enc | quote }}
  S3_SECRET_KEY: {{ .Values.s3.secretAccessKey | toString | b64enc | quote }}
{{- $admin := .Values.admin | default dict -}}
{{- if $admin.group }}
  GROUP: {{ $admin.group | default "" | b64enc | quote }}
{{- end }}
{{- if $admin.username }}
  ADMIN_USER: {{ $admin.username | default "" | b64enc | quote }}
{{- end }}
{{- if $admin.password }}
  ADMIN_PASSWORD: {{ $admin.password | default "" | b64enc | quote }}
{{- end }}
{{- end }}
